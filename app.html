<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1216" />
<meta name="description" content="A one-person college attendance tracker: subjects, weekly timetable, academic calendar, daily marking, projections and OCR for timetables and calendar notices. Everything stays in your browser." />
<title>Attendance dashboard — tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2338bdf8'/%3E%3Cpath d='M8 17l5 5 11-12' stroke='%230b0e12' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" title="Back to the home page">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span class="brand-text">
        <strong>Attendance</strong>
        <small id="brandSub">your semester, one screen</small>
      </span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <span class="tabs-pill" aria-hidden="true"></span>
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="dashboard" aria-selected="false">Dashboard</button>
      <button role="tab" data-tab="timetable" aria-selected="false">Timetable</button>
      <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
      <button role="tab" data-tab="subjects" aria-selected="false">Subjects</button>
      <button role="tab" data-tab="tools" aria-selected="false">Tools</button>
      <button role="tab" data-tab="data" aria-selected="false">Settings</button>
    </nav>
    <button class="icon-btn" id="themeToggle" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
<div class="modal-host" id="modalHost" hidden></div>

<script src="js/manipal-calendar.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/ocr.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/ui.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
